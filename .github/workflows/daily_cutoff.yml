name: Daily Absent Cutoff

on:
  schedule:
    # รันตอน 10:00 UTC ซึ่งตรงกับ "17:00 น. ประเทศไทย"
    # ระบบจะตื่นมาเช็คว่าใครยังไม่เช็คอิน แล้วปรับเป็น "ขาดงาน" ทันที
    - cron: '0 10 * * *'
    
  # เก็บไว้เพื่อให้คุณกดรันด้วยมือ (Manual Trigger) ได้ตอนทดสอบ
  workflow_dispatch:

jobs:
  cutoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install firebase-admin dayjs

      - name: Run Cutoff Script
        env:
          # ดึง Secret Key จาก GitHub Settings เพื่อเชื่อมต่อ Firebase
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/auto-cutoff.js